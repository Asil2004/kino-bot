name: Telegram Kino Bot 24/7

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:
  schedule:
    # Har 5 soatda qayta ishga tushirish (GitHub Actions 6 soatlik limitidan oldin avtomatik yangilanadi)
    - cron: '0 */5 * * *'

jobs:
  run-bot:
    runs-on: ubuntu-latest
    timeout-minutes: 340 # 5 soat 40 daqiqa davomida uzluksiz ishlaydi
    steps:
      - name: Repositoriyani yuklab olish
        uses: actions/checkout@v4

      - name: Python o'rnatish
        uses: setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Kutubxonalarni o'rnatish
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt

      - name: Botni 24/7 ishga tushirish
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN || '8970096817:AAHSNn7uriH_mMCeWjgvvLoh1sYBV39SSAQ' }}
          ADMINS: ${{ secrets.ADMINS || '7747943559' }}
          REQUIRED_CHANNEL: ${{ secrets.REQUIRED_CHANNEL || '' }}
          CHANNEL_URL: ${{ secrets.CHANNEL_URL || '' }}
        run: |
          echo "🚀 Bot ishga tushirilmoqda..."
          python bot.py
