name: Telegram Kino Bot 24/7

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:
  schedule:
    # Har 1 soatda avtomatik tekshiruv (zaxira reja)
    - cron: '0 * * * *'

concurrency:
  group: telegram-kino-bot-service
  cancel-in-progress: false

permissions:
  contents: write
  actions: write

jobs:
  run-bot:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - name: Repositoriyani yuklab olish
        uses: actions/checkout@v4

      - name: Python 3.11 ni sozlash
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Kerakli kutubxonalarni o'rnatish
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Botni uzluksiz ishga tushirish (24/7 Avtomatik estafeta)
        env:
          BOT_TOKEN: "8970096817:AAGVfnFLB6JnI7hJkZNIjwqFjXLUg3AAu3k"
          ADMINS: "7747943559,1044882545"
          REQUIRED_CHANNEL: ""
          CHANNEL_URL: ""
          INSTAGRAM_URL: "https://instagram.com/asilbek_ravshanov04"
          INSTAGRAM_NAME: "asilbek_ravshanov04"
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          CURRENT_RUN: ${{ github.run_id }}
        run: |
          python -c "
          import subprocess, time, os, urllib.request, json, sys

          RUN_DURATION = 5 * 3600  # 5 soatlik uzluksiz sikl

          print('==========================================')
          print('🤖 Bugunkinolar_bot 24/7 ishga tushirilmoqda...')
          print('==========================================')

          # Eski qolgan parallel runnerlarni to'xtatish
          token = os.environ.get('GH_TOKEN')
          repo = os.environ.get('REPO')
          current_run = int(os.environ.get('CURRENT_RUN', 0))
          if token and repo:
              headers = {'Authorization': f'token {token}', 'Accept': 'application/vnd.github.v3+json', 'User-Agent': 'Bot-Runner'}
              try:
                  url = f'https://api.github.com/repos/{repo}/actions/runs?status=in_progress'
                  req = urllib.request.Request(url, headers=headers)
                  with urllib.request.urlopen(req) as response:
                      data = json.loads(response.read().decode())
                      for run in data.get('workflow_runs', []):
                          run_id = run['id']
                          if run_id < current_run:
                              print(f'Eski runner toxtatilmoqda: {run_id}')
                              cancel_req = urllib.request.Request(f'https://api.github.com/repos/{repo}/actions/runs/{run_id}/cancel', headers=headers, method='POST')
                              try:
                                  urllib.request.urlopen(cancel_req)
                              except Exception:
                                  pass
              except Exception as e:
                  print('Status check:', e)

          proc = subprocess.Popen([sys.executable, 'bot.py'])
          start_time = time.time()

          while True:
              ret = proc.poll()
              if ret is not None:
                  print(f'⚠️ Bot toxtadi ({ret}). 3 soniyadan song qayta ishga tushirilmoqda...')
                  time.sleep(3)
                  proc = subprocess.Popen([sys.executable, 'bot.py'])

              elapsed = time.time() - start_time
              if elapsed >= RUN_DURATION:
                  print('⏰ 5 soatlik reja yakunlandi. Keyingi 24/7 runner ishga tushirilmoqda...')
                  if token and repo:
                      headers = {
                          'Authorization': f'token {token}',
                          'Accept': 'application/vnd.github.v3+json',
                          'User-Agent': 'Bot-Relay'
                      }
                      url = f'https://api.github.com/repos/{repo}/actions/workflows/bot.yml/dispatches'
                      req = urllib.request.Request(url, data=json.dumps({'ref': 'main'}).encode(), headers=headers, method='POST')
                      try:
                          with urllib.request.urlopen(req) as resp:
                              print('✅ Yangi 24/7 runner muvaffaqiyatli ishga tushirildi!')
                      except Exception as e:
                          print('⚠️ Dispatch xabari:', e)

                  proc.terminate()
                  try:
                      proc.wait(timeout=10)
                  except subprocess.TimeoutExpired:
                      proc.kill()
                  break

              time.sleep(5)
          "

      - name: Baza o'zgarishlarini saqlash
        if: always()
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add bot.db
          git diff --staged --quiet || (git commit -m "chore(db): sync database state [skip ci]" && git push)
